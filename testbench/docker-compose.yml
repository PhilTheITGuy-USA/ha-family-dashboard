# Local Home Assistant test bench for live-validating the family_dashboard integration.
# Everything else in testbench/ (config/, snapshots, dev.env, screenshots) is local state
# and gitignored - only this file is tracked.
name: ha-test-bench
services:
  homeassistant:
    container_name: ha-test-bench
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/New_York
    ports:
      - "8123:8123"
    restart: unless-stopped
